plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// Spring AI는 스프링부트와 별도로 버전이 매겨집니다.
// 2.0.x = Spring Boot 4.1 계열용 (Boot 3.x 프로젝트는 1.x를 써야 합니다)
ext {
	set('springAiVersion', '2.0.3')
}

dependencyManagement {
	imports {
		// BOM: Spring AI 관련 라이브러리 버전을 한 번에 맞춰 줍니다 (아래 starter에 버전을 안 적는 이유)
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ── AI 모델 연결 ──────────────────────────────────────────────
	// ① Ollama: 내 PC에서 돌리는 무료 로컬 모델 (API 키 불필요) — 기본값
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	// ② Anthropic(Claude): 유료 API, API 키 필요 — anthropic 프로필에서만 사용
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	// 두 starter가 같이 있어도 application.properties의 spring.ai.model.chat 값으로 하나만 켜집니다.

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

