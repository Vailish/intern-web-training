<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spring AI 기본 샘플</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.answer { white-space: pre-wrap; }   /* AI 답변의 줄바꿈 유지 */
		.meta { font-size: .8rem; color: #6c757d; }
	</style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 760px;">
	<h1 class="h3 mb-1">🤖 Spring AI 기본 샘플</h1>
	<p class="text-muted mb-4">브라우저 → <b>우리 스프링 서버</b> → AI 모델. 브라우저는 AI 를 직접 부르지 않습니다.</p>

	<!-- 기능 1: 자유 질문 -->
	<div class="card mb-4">
		<div class="card-body">
			<h2 class="h5">① 질문하기 <small class="text-muted">POST /api/chat</small></h2>
			<form id="chatForm">
				<textarea id="chatInput" class="form-control mb-2" rows="2" maxlength="500"
						  placeholder="예) REST API 가 뭔지 쉽게 설명해 줘"></textarea>
				<button id="chatBtn" class="btn btn-primary">보내기</button>
			</form>
			<div id="chatResult" class="mt-3 d-none">
				<div class="answer border rounded p-3 bg-white" id="chatAnswer"></div>
				<div class="meta mt-1" id="chatMeta"></div>
			</div>
		</div>
	</div>

	<!-- 기능 2: 구조화 출력 -->
	<div class="card mb-4">
		<div class="card-body">
			<h2 class="h5">② 자기소개 분석 <small class="text-muted">POST /api/intro/analyze</small></h2>
			<form id="introForm">
				<textarea id="introInput" class="form-control mb-2" rows="4" maxlength="2000"
						  placeholder="예) 안녕하세요. 스프링부트와 MySQL 로 게시판을 만들어 본 신입 개발자입니다..."></textarea>
				<button id="introBtn" class="btn btn-success">분석하기</button>
			</form>
			<div id="introResult" class="mt-3 d-none">
				<table class="table table-sm bg-white mb-0">
					<tr><th style="width: 110px;">요약</th><td id="introSummary"></td></tr>
					<tr><th>키워드</th><td id="introKeywords"></td></tr>
					<tr><th>추천 분야</th><td id="introField"></td></tr>
				</table>
			</div>
		</div>
	</div>

	<div id="errorBox" class="alert alert-danger d-none"></div>
	<p class="meta">⚠️ AI 답변은 틀릴 수 있습니다. 중요한 내용은 공식 문서로 확인하세요.</p>
</div>

<script>
	const errorBox = document.getElementById('errorBox');

	// 공통: 우리 서버의 API 호출. 실패하면 서버가 준 {"error": "..."} 문장을 보여줌.
	async function postJson(url, body, button) {
		errorBox.classList.add('d-none');
		button.disabled = true;
		const originalLabel = button.textContent;
		button.textContent = 'AI 가 생각 중…';
		try {
			const res = await fetch(url, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify(body)
			});
			const data = await res.json().catch(() => ({}));
			if (!res.ok) {
				throw new Error(data.error || ('요청 실패 (HTTP ' + res.status + ')'));
			}
			return data;
		} catch (e) {
			// ⚠️ 화면에 넣을 때는 항상 textContent — innerHTML 금지 (아래 설명 참고)
			errorBox.textContent = e.message;
			errorBox.classList.remove('d-none');
			return null;
		} finally {
			button.disabled = false;
			button.textContent = originalLabel;
		}
	}

	// ① 질문하기
	document.getElementById('chatForm').addEventListener('submit', async (e) => {
		e.preventDefault();
		const data = await postJson('/api/chat',
				{message: document.getElementById('chatInput').value},
				document.getElementById('chatBtn'));
		if (!data) return;
		// AI 출력은 "믿을 수 없는 입력"입니다. AI 가 <script> 를 답하더라도
		// textContent 로 넣으면 글자로만 보이고 실행되지 않습니다. (innerHTML 이면 XSS 위험)
		document.getElementById('chatAnswer').textContent = data.answer;
		document.getElementById('chatMeta').textContent =
				`모델: ${data.model ?? '?'} · 토큰: ${data.totalTokens ?? '?'} · ${(data.elapsedMs / 1000).toFixed(1)}초`;
		document.getElementById('chatResult').classList.remove('d-none');
	});

	// ② 자기소개 분석
	document.getElementById('introForm').addEventListener('submit', async (e) => {
		e.preventDefault();
		const data = await postJson('/api/intro/analyze',
				{text: document.getElementById('introInput').value},
				document.getElementById('introBtn'));
		if (!data) return;
		document.getElementById('introSummary').textContent = data.summary;
		document.getElementById('introKeywords').textContent = (data.keywords || []).join(', ');
		document.getElementById('introField').textContent = data.field;
		document.getElementById('introResult').classList.remove('d-none');
	});
</script>
</body>
</html>
