spring.application.name=ai-chat
server.port=8080

# ─────────────────────────────────────────────────────────────
# 1) 어떤 AI 모델 회사를 쓸지 고르기 (build.gradle 에 starter 가 2개 있음)
#    ollama    = 내 PC 의 무료 로컬 모델 (기본값, API 키 불필요)
#    anthropic = Claude API (유료, API 키 필요) → application-anthropic.properties 참고
# ─────────────────────────────────────────────────────────────
spring.ai.model.chat=ollama

# ─────────────────────────────────────────────────────────────
# 2) Ollama 설정
#    ⚠️ Spring AI 2.0 부터 키 이름이 바뀌었습니다.
#       인터넷 예제의 spring.ai.ollama.chat.options.model (1.x 방식) 은 폐기 예정(deprecated)
#       → spring.ai.ollama.chat.model 을 쓰세요.
# ─────────────────────────────────────────────────────────────
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:1.5b
# 답변의 무작위성(0=항상 비슷, 1=다양). 교육용으로 낮게.
spring.ai.ollama.chat.temperature=0.3
# 모델이 PC 에 없을 때 자동 다운로드하지 않음 (수 GB 다운로드가 몰래 시작되는 것 방지)
# → README 대로 터미널에서 ollama pull 을 먼저 하세요.
spring.ai.ollama.init.pull-model-strategy=never

# ─────────────────────────────────────────────────────────────
# 3) 타임아웃 — 외부 API 호출과 똑같이 반드시 설정
#    LLM 은 일반 API 보다 훨씬 느립니다(수 초~수십 초). read-timeout 을 넉넉히.
#    (Boot 4 의 공통 HTTP 클라이언트 설정이며, Ollama 연결에 적용됩니다)
# ─────────────────────────────────────────────────────────────
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=60s

# ─────────────────────────────────────────────────────────────
# 4) 재시도 — ⚠️ Spring AI 기본값은 "최대 10번, 2초→10초→50초… 대기" 입니다.
#    AI 서버가 꺼져 있으면 사용자가 몇 분씩 기다리게 되므로 줄입니다.
# ─────────────────────────────────────────────────────────────
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=3s
