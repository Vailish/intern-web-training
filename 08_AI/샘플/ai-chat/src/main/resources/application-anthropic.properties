# ─────────────────────────────────────────────────────────────
# Claude(Anthropic) 로 바꿔 실행하는 프로필
#   실행:  ./gradlew bootRun --args='--spring.profiles.active=anthropic'
#   준비:  환경변수 ANTHROPIC_API_KEY 에 키 설정 (README 3장)
#
# ⚠️ 회사가 승인한 키·모델인지 멘토에게 먼저 확인하세요. 호출할 때마다 요금이 나갑니다.
# ⚠️ API 키를 이 파일에 직접 적지 마세요. ${...} 는 "환경변수에서 읽어라" 라는 뜻입니다.
# ─────────────────────────────────────────────────────────────
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

# 모델 이름은 자주 바뀝니다. 항상 공식 문서의 모델 목록에서 확인하세요.
# (2026-11 기준 값. 더 저렴한 모델로 바꾸는 것은 멘토와 상의 후 결정)
spring.ai.anthropic.chat.model=claude-opus-5-5
# 응답 길이의 "상한"입니다 (목표 길이가 아님). 답변 길이는 프롬프트로 조절합니다.
spring.ai.anthropic.chat.max-tokens=16000
# Claude API 호출 전체 제한 시간
spring.ai.anthropic.timeout=60s
