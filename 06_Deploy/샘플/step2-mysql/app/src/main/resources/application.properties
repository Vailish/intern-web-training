# 애플리케이션 이름
spring.application.name=intro

# ===== [STEP 2 변경] MySQL 데이터베이스 =====
# ${이름:기본값} 문법: "환경변수 이름이 있으면 그 값, 없으면 기본값"을 씁니다.
# → 같은 jar(이미지)를 고치지 않고, 실행할 때 -e DB_HOST=... 로 접속 대상을 바꿀 수 있습니다.
#
#   내 PC에서 bootRun 할 때    : DB_HOST 생략 → localhost
#   컨테이너로 실행할 때        : DB_HOST=intro-db (STEP 2) / DB_HOST=db (STEP 3, compose 서비스 이름)
#
# ⚠️ 컨테이너 안에서 localhost 는 "그 컨테이너 자기 자신"입니다. DB 컨테이너가 아닙니다!
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:introdb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:intro}
# 비밀번호는 기본값을 두지 않습니다. 반드시 실행 시 DB_PASSWORD 로 넘겨야 합니다. (코드에 비밀번호 저장 금지)
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA =====
# update: 엔티티에 맞춰 MySQL에 테이블(intro)을 자동으로 만듭니다. H2 때와 동일한 설정입니다.
# (실무 운영 DB에서는 validate + Flyway 같은 마이그레이션 도구를 씁니다)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 웹 콘솔 설정은 삭제했습니다. MySQL은 Workbench 나 docker exec 로 들여다봅니다.
