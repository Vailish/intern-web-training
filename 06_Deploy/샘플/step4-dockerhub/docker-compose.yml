# =========================================================
#  [STEP 4] Docker Hub 에서 "이미지만 받아서" 실행하기
#
#  STEP 3 과 비교해 보세요. 딱 하나가 다릅니다.
#    STEP 3:  build: ../step2-mysql/app   → 소스코드로 이미지를 "만들어서" 실행
#    STEP 4:  build 없음, image 만 있음  → Docker Hub 에서 이미지를 "받아서" 실행
#
#  그래서 이 폴더에는 소스코드·Dockerfile 이 하나도 없습니다.
#  이 파일 + .env 두 개만 있으면 어느 PC·서버에서든 서비스가 뜹니다. ← 이것이 "배포"입니다.
#
#  준비:  .env.example 을 복사해 .env 를 만들고 DOCKERHUB_USER 와 비밀번호를 채웁니다.
#  실행:  docker compose pull      (이미지 내려받기 — up 이 알아서 하지만 눈으로 보려고 따로 실행)
#         docker compose up -d
#  종료:  docker compose down       (DB 데이터까지 지우려면 docker compose down -v)
# =========================================================

# STEP 3(intro-stack)과 이름을 다르게 해서 컨테이너·볼륨이 섞이지 않게 합니다.
name: intro-hub

services:

  # ---------------- DB (MySQL) ----------------
  db:
    # ⭐ build 가 없습니다! "Docker Hub 사용자명/저장소이름:태그" 이미지를 내려받아 실행합니다.
    image: ${DOCKERHUB_USER:?.env 파일에 DOCKERHUB_USER 를 설정하세요}/intro-db:${DB_TAG:-1.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 파일에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      MYSQL_USER: ${MYSQL_USER:-intro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env 파일에 MYSQL_PASSWORD 를 설정하세요}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # STEP 3 과 동일. -h 127.0.0.1(TCP) 로 검사해야 초기화용 임시 서버에 속지 않습니다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ---------------- 앱 (스프링부트) ----------------
  app:
    image: ${DOCKERHUB_USER:?.env 파일에 DOCKERHUB_USER 를 설정하세요}/intro-app:${APP_TAG:-1.0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 비밀번호는 이미지에 들어 있지 않습니다. 실행하는 쪽(.env)에서 넣어 줍니다.
      DB_HOST: db
      DB_USERNAME: ${MYSQL_USER:-intro}
      DB_PASSWORD: ${MYSQL_PASSWORD:?.env 파일에 MYSQL_PASSWORD 를 설정하세요}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  mysql-data:
