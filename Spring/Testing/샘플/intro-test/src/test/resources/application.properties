# 테스트 전용 설정 (src/test/resources 는 테스트 실행 시 main 설정을 덮어씁니다)
#
# 왜 테스트는 인메모리 H2를 쓸까?
#  - 테스트는 "매번 깨끗한 DB"에서 시작해야 결과가 일정합니다. 인메모리는 실행 때마다 새로 만들어집니다.
#  - 파일 DB(main 설정의 ./data/introdb)는 bootRun 서버가 켜져 있으면 잠금(lock) 충돌이 납니다.
#  - 빨라서 테스트를 자주 돌리기 좋습니다.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
